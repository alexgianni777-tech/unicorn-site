name: Verify Amazon link destinations

on:
  push:
    branches:
      - "fix/restore-product-images-2026-10-02"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve affiliate links
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          products = json.loads(Path("products.json").read_text())
          for p in products:
              url = p["url"]
              if "amzn.to" not in url:
                  print(f'{p["id"]}\tSEARCH\t{url}')
                  continue
              cmd = [
                  "curl", "-L", "-sS", "-o", "/dev/null",
                  "-A", "Mozilla/5.0",
                  "-w", "%{url_effective}", url
              ]
              final = subprocess.check_output(cmd, text=True).strip()
              print(f'{p["id"]}\t{final}')
          PY
