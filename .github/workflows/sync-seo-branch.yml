name: Sync SEO branch

on:
  push:
    branches: ["seo-internal-link-hub"]
    paths:
      - "build.py"
      - "assets/style.css"
      - ".github/workflows/sync-seo-branch.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-internal-link-hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build generated site
        run: python build.py
      - name: Commit generated pages
        run: |
          git config user.name "unicorn-site-bot"
          git config user.email "actions@github.com"
          git add index.html guides/ tools/ about.html privacy.html sitemap.xml robots.txt "unicorn-store (2).html"
          git diff --cached --quiet && exit 0
          git commit -m "build: sync internal-link hub pages"
          git push origin HEAD:seo-internal-link-hub
