name: IndexNow discovery

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "guides/**/*.html"
      - "tools/**/*.html"
      - "sitemap.xml"
      - "products.json"
      - "6a0072dc7a79a62e4ed556a7b42a4636.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published IndexNow key
        run: |
          key="6a0072dc7a79a62e4ed556a7b42a4636"
          for attempt in 1 2 3 4 5 6 7 8; do
            body="$(curl -fsS "https://unicornsite.online/$key.txt" || true)"
            if [ "$body" = "$key" ]; then
              echo "IndexNow key is live."
              exit 0
            fi
            echo "Key not live yet; retry $attempt/8"
            sleep 20
          done
          echo "IndexNow key file did not become reachable in time."
          exit 1
      - name: Build IndexNow payload from sitemap
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          key = "6a0072dc7a79a62e4ed556a7b42a4636"
          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [n.text for n in root.findall("sm:url/sm:loc", ns) if n.text]
          payload = {
              "host": "unicornsite.online",
              "key": key,
              "keyLocation": f"https://unicornsite.online/{key}.txt",
              "urlList": urls,
          }
          Path("/tmp/indexnow.json").write_text(json.dumps(payload), encoding="utf-8")
          print(f"Prepared {len(urls)} URLs for IndexNow.")
          PY
      - name: Submit changed site URLs to IndexNow
        run: |
          code="$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}"             -X POST "https://api.indexnow.org/indexnow"             -H "Content-Type: application/json; charset=utf-8"             --data-binary @/tmp/indexnow.json)"
          echo "IndexNow HTTP $code"
          cat /tmp/indexnow-response.txt || true
          case "$code" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
