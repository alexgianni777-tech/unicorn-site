name: Sync generated site on growth branch

on:
  push:
    branches: ["profitability-content-funnel"]
    paths:
      - "build.py"
      - "assets/gift-finder.js"
      - "assets/style.css"
      - ".github/workflows/sync-growth-branch.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profitability-content-funnel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build generated site
        run: python build.py
      - name: Commit generated pages
        run: |
          git config user.name "unicorn-site-bot"
          git config user.email "actions@github.com"
          git add index.html guides/ tools/ about.html privacy.html sitemap.xml robots.txt "unicorn-store (2).html"
          git diff --cached --quiet && exit 0
          git commit -m "build: sync profitability funnel pages"
          git push origin HEAD:profitability-content-funnel
